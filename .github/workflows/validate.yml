name: Validate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m py_compile backend/server.py
      - run: python - <<'PY'
        import json
        json.load(open('manifest.json'))
        print('manifest ok')
        PY
